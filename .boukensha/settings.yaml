tasks:
  player:
    provider: anthropic
    model: claude-haiku-4-5
    prompt_override:
      system: true
    # Per-turn ceilings, all optional — the commented defaults are what step 12
    # uses when the key is absent. 0 disables a ceiling.
    #
    # Restored after the 05-08 mapping run. That run used max_iterations: 80
    # with max_turn_tokens disabled and cost $1.07 in 166 seconds — cost is not
    # linear in iterations, because every call re-sends the whole conversation,
    # so the last iterations cost several times the first.
    #
    # Both ceilings are ON by default now. Raise them deliberately, for one run,
    # and put them back.
    max_iterations: 25           # tool-call ceiling for one turn
    max_turn_tokens: 60000       # input+output tokens one turn may spend
    # max_output_tokens: 1024    # per-call output cap
    #
    # Compaction still has never fired. The 05-08 run peaked around 25k tokens
    # against a 30k trigger (0.15 of a 200k window) and stopped just short. A
    # threshold near 0.08 would fire it — see layer1 §1.6.
    compaction_threshold: 0.85
mud:
  host: localhost
  port: 4000
  username: dummy
  password: helloworld

# MCP servers, as data rather than code. Each entry is one subprocess.
# Register them with `mcp: true` (the "mud" entry) or BOUKENSHA_MCP=1.
mcp_servers:
  mud:
    command: mud-manager
    args: [--mcp]
    # Prefixed by MUD engine, so tools arrive as tbamud__look, tbamud__attack.
    # Applied client-side — the daemon still advertises bare names on the wire.
    prefix: tbamud
    # env is layered over the mud: block above, so credentials are not repeated.

  # A third-party server needs no boukensha code — only an entry here.
  # required: false means a failure to spawn warns and is skipped, rather than
  # stopping the agent from starting.
  # filesystem:
  #   command:  npx
  #   args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
  #   prefix:   fs
  #   required: false